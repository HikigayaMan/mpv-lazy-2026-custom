# Copy to portable_config/script-opts/douyu_danmaku.conf when overriding defaults.
# Douyu live chat is rendered by its own OSD overlay and does not share uosc_danmaku.
font=SimHei
font_size=16
font_scale=1.0
opacity=0.55
outline=1
shadow=0
bold=yes
scroll_duration=10
speed_scale=1.0
display_area=0.25
lane_spacing=8
show_nick=yes
source_colors=yes
max_pending=300
max_active=48
max_launch_rate=10
max_queue_age=2.0
max_render_fps=120
fallback_fps=60
